<div class="compare-step">
  <h2 class="compare-step__title">Compare the Stocks</h2>
  <p class="compare-step__description">
    See all 5 stocks side by side. Which one was the best investment?
  </p>

  <!-- Line chart -->
  <app-multi-line-chart [picks]="state.picks()"></app-multi-line-chart>

  <!-- ROI summary table -->
  <app-roi-summary-table [picks]="state.picks()"></app-roi-summary-table>

  <!-- Reflection questions grounded in what's on screen -->
  <app-reflection-form
    [report]="state.report()"
    [picks]="state.picks()"
    [fields]="compareFields"
    (reportChange)="onReportChange($event)">
  </app-reflection-form>

  <!-- Advance -->
  <div class="compare-step__actions">
    <button class="ngpf-btn ngpf-btn-primary" (click)="onAdvance()">
      &#x1F5A8; Print My Report
    </button>
    <p class="compare-step__print-note">
      Opens your print dialog. Choose "Save as PDF" if your teacher asked for a file.
    </p>
  </div>
</div>
