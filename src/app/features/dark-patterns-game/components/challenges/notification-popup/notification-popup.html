<div class="notification-popup">
  <div class="notification-popup__phone">
    <div class="notification-popup__status-bar">
      <span>9:41 AM</span>
      <span class="notification-popup__status-icons" aria-hidden="true">📶 🔋</span>
    </div>

    <div class="notification-popup__app-header">
      <div class="notification-popup__app-icon" aria-hidden="true">
        <span>V</span>
      </div>
      <span class="notification-popup__app-name">Vibe</span>
    </div>

    <div class="notification-popup__overlay">
      <div class="notification-popup__dialog" role="dialog" aria-labelledby="notif-title">
        <div class="notification-popup__dialog-icon" aria-hidden="true">🔔</div>
        <h3 id="notif-title" class="notification-popup__dialog-title">
          "Vibe" Would Like to Send You Notifications
        </h3>
        <p class="notification-popup__dialog-body">
          Stay connected! Get instant updates when your friends post, go live,
          or share stories you won't want to miss.
        </p>

        <button
          type="button"
          class="notification-popup__accept-btn"
          (click)="onAccept()"
        >
          Keep me in the loop!
        </button>

        <button
          type="button"
          class="notification-popup__decline-btn"
          (click)="onDecline()"
        >
          No thanks, I'd rather miss out on what my friends are sharing
        </button>
      </div>
    </div>
  </div>
</div>
