<div class="false-urgency">
  <div class="false-urgency__site">
    <div class="false-urgency__site-header">
      <span class="false-urgency__logo">🎧 SoundGear</span>
      <div class="false-urgency__search" aria-hidden="true">
        <span>🔍 Search products...</span>
      </div>
      <span class="false-urgency__cart" aria-hidden="true">🛒 Cart (0)</span>
    </div>

    <div class="false-urgency__product">
      <div class="false-urgency__product-image" aria-hidden="true">
        <div class="false-urgency__headphones-icon">🎧</div>
      </div>

      <div class="false-urgency__product-info">
        <h3 class="false-urgency__product-title">ProSound X200 Wireless Headphones</h3>
        <div class="false-urgency__rating" aria-hidden="true">
          ⭐⭐⭐⭐⭐ <span>(2,847 reviews)</span>
        </div>

        <div class="false-urgency__price">
          <span class="false-urgency__price-current">$49.99</span>
          <span class="false-urgency__price-original">$79.99</span>
          <span class="false-urgency__price-discount">38% off</span>
        </div>

        <!-- Urgency signals -->
        <div class="false-urgency__timer">
          <span class="false-urgency__timer-icon" aria-hidden="true">⏰</span>
          <span class="false-urgency__timer-label">SALE ENDS IN</span>
          <span class="false-urgency__timer-value">{{ countdown() }}</span>
        </div>

        <div class="false-urgency__stock-warning">
          <span aria-hidden="true">🔴</span> Only 3 left in stock!
        </div>

        <div class="false-urgency__viewers">
          <span aria-hidden="true">👁️</span> {{ viewers() }} people are viewing this right now
        </div>

        <div class="false-urgency__shipping-warning">
          <span aria-hidden="true">🚚</span> Order in the next <strong>23 minutes</strong> for same-day shipping!
        </div>

        <div class="false-urgency__actions">
          <button
            type="button"
            class="false-urgency__add-to-cart"
            (click)="onAddToCart()"
          >
            Add to Cart
          </button>
          <button
            type="button"
            class="false-urgency__save-for-later"
            (click)="onSaveForLater()"
          >
            Save for Later
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
