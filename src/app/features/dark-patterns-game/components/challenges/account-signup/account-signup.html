<div class="account-signup">
  <div class="account-signup__card">
    <div class="account-signup__header">
      <div class="account-signup__brand" aria-hidden="true">
        <span class="account-signup__brand-icon">🛒</span>
        <span class="account-signup__brand-name">ShopEasy</span>
      </div>
      <h3 class="account-signup__title">Create Your Account</h3>
      <p class="account-signup__subtitle">Join millions of happy shoppers</p>
    </div>

    <div class="account-signup__form" role="form" aria-label="Account signup form">
      <div class="account-signup__field">
        <label class="account-signup__label">Full Name</label>
        <div class="account-signup__input-fake" aria-hidden="true">Alex Johnson</div>
      </div>

      <div class="account-signup__field">
        <label class="account-signup__label">Email Address</label>
        <div class="account-signup__input-fake" aria-hidden="true">alex.johnson&#64;email.com</div>
      </div>

      <div class="account-signup__field">
        <label class="account-signup__label">Password</label>
        <div class="account-signup__input-fake" aria-hidden="true">••••••••••</div>
      </div>

      <div class="account-signup__checkboxes">
        <label class="account-signup__checkbox-row">
          <input
            type="checkbox"
            [checked]="termsChecked()"
            (change)="termsChecked.set(!termsChecked())"
          />
          <span class="account-signup__checkbox-text">
            I agree to the <a href="javascript:void(0)">Terms of Service</a> and
            <a href="javascript:void(0)">Privacy Policy</a>
          </span>
        </label>

        <label class="account-signup__checkbox-row">
          <input
            type="checkbox"
            [checked]="marketingChecked()"
            (change)="marketingChecked.set(!marketingChecked())"
          />
          <span class="account-signup__checkbox-text">
            Send me personalized deals and offers via email
          </span>
        </label>

        <label class="account-signup__checkbox-row">
          <input
            type="checkbox"
            [checked]="sharingChecked()"
            (change)="sharingChecked.set(!sharingChecked())"
          />
          <span class="account-signup__checkbox-text">
            Share my activity with trusted partners to improve my experience
          </span>
        </label>
      </div>

      <button
        type="button"
        class="account-signup__submit-btn"
        (click)="onCreateAccount()"
      >
        Create Account
      </button>

      <p class="account-signup__signin-link">
        Already have an account? <a href="javascript:void(0)">Sign in</a>
      </p>
    </div>
  </div>
</div>
