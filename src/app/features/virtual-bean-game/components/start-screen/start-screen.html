<div class="start-screen">
  <div class="start-screen__hero">
    <h2>Virtual Bean Game</h2>
    <p>
      You have <strong>20 beans</strong> to spend across 11 budget categories.
      Choose wisely. Your income may change, and life has a way of throwing surprises.
    </p>
  </div>

  <div class="start-screen__stats" aria-hidden="true">
    <div class="start-screen__stat">
      <span class="start-screen__stat-number">20</span>
      <span class="start-screen__stat-label">Beans</span>
    </div>
    <div class="start-screen__stat-divider"></div>
    <div class="start-screen__stat">
      <span class="start-screen__stat-number">11</span>
      <span class="start-screen__stat-label">Categories</span>
    </div>
    <div class="start-screen__stat-divider"></div>
    <div class="start-screen__stat">
      <span class="start-screen__stat-number">3</span>
      <span class="start-screen__stat-label">Rounds</span>
    </div>
  </div>

  @if (showSeedInput()) {
    <div class="start-screen__seed-entry">
      <label for="seed-input" class="start-screen__seed-label">
        Enter a 4-character life path code:
      </label>
      <input
        id="seed-input"
        type="text"
        class="start-screen__seed-input"
        maxlength="4"
        [value]="seedValue()"
        (input)="onSeedInput($event)"
        (keydown)="onKeydown($event)"
        placeholder="e.g. XKQM"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
  }

  <button class="ngpf-btn ngpf-btn-primary start-screen__start-btn" (click)="onStart()">
    Start Game
  </button>

  <button
    class="start-screen__seed-toggle"
    (click)="toggleSeedInput()"
  >
    {{ showSeedInput() ? 'Cancel' : 'Have a life path code from your teacher?' }}
  </button>
</div>
