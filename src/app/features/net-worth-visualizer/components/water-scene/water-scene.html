<svg
  class="water-scene"
  [class.water-scene--water]="phaseHasWater()"
  [class.water-scene--final]="phaseIsFinal()"
  [attr.viewBox]="'0 0 ' + W + ' ' + H"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-label="Two people standing on the same wealth line. Marcus makes twice the salary but sinks below the waterline once his debts drop in. Priya's home lifts her above."
>
  <defs>
    <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdc85" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#eaf3fb" />
      <stop offset="100%" stop-color="#cfe4f7" />
    </linearGradient>
    <linearGradient id="water-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5aa9d6" />
      <stop offset="55%" stop-color="#1f6ea4" />
      <stop offset="100%" stop-color="#0a2f4d" />
    </linearGradient>
    <linearGradient id="wave-glint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.8" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>

    <!-- Icon library -->
    <symbol id="icon-home" viewBox="0 0 60 60">
      <path d="M8 30 L30 8 L52 30 L52 54 L8 54 Z" fill="#a67c52" stroke="#5b3f28" stroke-width="2.5" stroke-linejoin="round" />
      <rect x="24" y="38" width="12" height="16" fill="#5b3f28" />
      <rect x="14" y="34" width="8" height="8" fill="#e6f2ff" />
      <rect x="38" y="34" width="8" height="8" fill="#e6f2ff" />
      <path d="M8 30 L30 8 L52 30" fill="none" stroke="#8a4b2c" stroke-width="3" />
    </symbol>
    <symbol id="icon-car" viewBox="0 0 60 40">
      <path d="M6 26 L14 12 L46 12 L54 26 L54 32 L6 32 Z" fill="#2f6fb0" stroke="#183759" stroke-width="2" stroke-linejoin="round" />
      <rect x="16" y="15" width="12" height="10" fill="#dff1ff" opacity="0.9" />
      <rect x="32" y="15" width="12" height="10" fill="#dff1ff" opacity="0.9" />
      <circle cx="18" cy="32" r="5" fill="#222" />
      <circle cx="42" cy="32" r="5" fill="#222" />
    </symbol>
    <symbol id="icon-anchor" viewBox="0 0 60 70">
      <circle cx="30" cy="10" r="7" fill="none" stroke="#2b2b2b" stroke-width="4" />
      <path d="M30 17 V 58" stroke="#2b2b2b" stroke-width="5" fill="none" />
      <path d="M12 44 Q 30 66 48 44" stroke="#2b2b2b" stroke-width="5" fill="none" stroke-linecap="round" />
      <path d="M22 42 H 38" stroke="#2b2b2b" stroke-width="5" />
    </symbol>
    <symbol id="icon-weight" viewBox="0 0 60 60">
      <path d="M14 22 L46 22 L44 52 L16 52 Z" fill="#3b3b3b" stroke="#111" stroke-width="2" />
      <rect x="22" y="12" width="16" height="12" rx="2" fill="#111" />
    </symbol>
    <symbol id="icon-card" viewBox="0 0 60 40">
      <rect x="4" y="6" width="52" height="30" rx="4" fill="#a02020" stroke="#5a0f0f" stroke-width="2" />
      <rect x="4" y="12" width="52" height="6" fill="#5a0f0f" />
      <rect x="10" y="24" width="20" height="4" fill="#ffe6b5" />
    </symbol>
    <symbol id="icon-coin" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="24" fill="#f2c94c" stroke="#8f6c14" stroke-width="3" />
      <text x="30" y="38" text-anchor="middle" font-family="serif" font-weight="800" font-size="24" fill="#5a4207">$</text>
    </symbol>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" [attr.width]="W" [attr.height]="H" fill="url(#sky-grad)" />

  <!-- Sun + clouds (atmosphere) -->
  <circle [attr.cx]="W - 90" cy="82" r="46" fill="#ffcf5a" opacity="0.7" />
  <circle [attr.cx]="W - 90" cy="82" r="34" fill="#ffe289" opacity="0.85" />
  <g class="water-scene__clouds" fill="white" opacity="0.85">
    <ellipse cx="140" cy="70" rx="70" ry="18" />
    <ellipse cx="180" cy="58" rx="46" ry="14" />
    <ellipse cx="620" cy="48" rx="60" ry="16" />
    <ellipse cx="660" cy="38" rx="34" ry="10" />
  </g>

  <!-- Ground rectangle: visible in the setup/ground phase, then fades out
       as water fades in. -->
  <rect
    class="water-scene__ground"
    x="0"
    [attr.y]="waterlineY"
    [attr.width]="W"
    [attr.height]="H - waterlineY"
    fill="#a3b6c8"
  />

  <!-- Water rectangle: hidden initially, fades to full opacity once phase
       is 'water' or later. -->
  <rect
    class="water-scene__water"
    x="0"
    [attr.y]="waterlineY"
    [attr.width]="W"
    [attr.height]="H - waterlineY"
    fill="url(#water-grad)"
  />

  <!-- Surface waves -->
  <path
    class="water-scene__wave"
    [attr.d]="'M0 ' + (waterlineY + 4) + ' Q 100 ' + (waterlineY - 2) + ' 200 ' + (waterlineY + 4) + ' T 400 ' + (waterlineY + 4) + ' T 600 ' + (waterlineY + 4) + ' T 800 ' + (waterlineY + 4) + ' T 1000 ' + (waterlineY + 4)"
    fill="none"
    stroke="url(#wave-glint)"
    stroke-width="2"
  />

  <!-- Waterline stroke -->
  <line
    class="water-scene__waterline"
    x1="0"
    [attr.y1]="waterlineY"
    [attr.x2]="W"
    [attr.y2]="waterlineY"
    stroke="#0a2f4d"
    stroke-width="3"
  />

  <!-- "$0 NET WORTH" pill on the waterline -->
  <g class="water-scene__zero-pill" [attr.transform]="'translate(500, ' + (waterlineY - 12) + ')'">
    <rect x="-78" y="-16" width="156" height="24" rx="12" fill="white" stroke="#0a2f4d" stroke-width="2" />
    <text x="0" y="1" text-anchor="middle" font-family="var(--ngpf-font-heading)" font-size="12" font-weight="800" fill="#0a2f4d" letter-spacing="1.4">$0 NET WORTH</text>
  </g>

  @for (c of characters(); track c.profile.id) {
    <!-- Salary "column" hovering above each character. Present from the start
         and does NOT move with the character, so once the character sinks it
         visibly separates from them. -->
    <g class="water-scene__salary" [attr.transform]="'translate(' + c.centerX + ',' + (waterlineY - 200) + ')'">
      <rect x="-36" [attr.y]="-c.salaryBarHeight" width="72" [attr.height]="c.salaryBarHeight" fill="#f2c94c" stroke="#8f6c14" stroke-width="2" rx="4" />
      <rect x="-36" y="-4" width="72" height="8" fill="#8f6c14" opacity="0.6" />
      <text x="0" [attr.y]="-c.salaryBarHeight - 14" text-anchor="middle" font-family="var(--ngpf-font-heading)" font-size="12" font-weight="800" fill="#5a4207">
        ${{ c.profile.salary | number: '1.0-0' }}/yr
      </text>
      <text x="0" y="20" text-anchor="middle" font-family="var(--ngpf-font-heading)" font-size="9" font-weight="800" fill="#5a4207" letter-spacing="1.4">SALARY</text>
      <!-- Dashed tether that reveals in the final phase, connecting the
           salary bar to the character below (visibly disconnected). -->
      <line
        class="water-scene__tether"
        x1="0" y1="30"
        x2="0"
        [attr.y2]="waterlineY - (waterlineY - 200) + characterYOffset(c) - 60"
        stroke="#8f6c14" stroke-width="2" stroke-dasharray="5 5"
      />
    </g>
  }

  <!-- Characters + their attachments -->
  @for (c of characters(); track c.profile.id) {
    <g
      class="water-scene__stage"
      [attr.transform]="'translate(' + c.centerX + ',' + waterlineY + ')'"
    >
      <!-- Assets flare up from the character; each fades in staggered -->
      <g class="water-scene__attachments" [class.water-scene__attachments--visible]="phaseShowsAssets()">
        @for (a of c.assets; track a.label + $index) {
          <g class="water-scene__attach water-scene__attach--asset" [style.--stagger]="a.staggerMs + 'ms'"
             [style.transform]="'translateY(' + characterYOffset(c) + 'px)'">
            <path
              [attr.d]="chainTo(a, c)"
              stroke="#1a1a1a"
              stroke-width="1.5"
              fill="none"
            />
            <use
              [attr.href]="'#icon-' + iconRef(a.icon)"
              [attr.x]="a.x - a.size / 2"
              [attr.y]="a.y - a.size / 2"
              [attr.width]="a.size"
              [attr.height]="a.size"
            />
            <g [attr.transform]="'translate(' + a.x + ',' + (a.y - a.size / 2 - 14) + ')'">
              <rect x="-74" y="-14" width="148" height="24" rx="12" fill="white" stroke="#2e7d32" stroke-width="1.5" opacity="0.98" />
              <text x="0" y="4" text-anchor="middle" font-family="var(--ngpf-font-heading)" font-size="12" font-weight="700" fill="#2e7d32">
                {{ a.label }} +${{ a.value | number: '1.0-0' }}
              </text>
            </g>
          </g>
        }
      </g>

      <!-- Debts drop from below; staggered fade + slide -->
      <g class="water-scene__attachments" [class.water-scene__attachments--visible]="phaseShowsDebts()">
        @for (d of c.debts; track d.label + $index) {
          <g class="water-scene__attach water-scene__attach--debt" [style.--stagger]="d.staggerMs + 'ms'"
             [style.transform]="'translateY(' + characterYOffset(c) + 'px)'">
            <path
              [attr.d]="chainTo(d, c)"
              stroke="#2b2b2b"
              stroke-width="1.6"
              fill="none"
              stroke-dasharray="3 3"
            />
            <use
              [attr.href]="'#icon-' + iconRef(d.icon)"
              [attr.x]="d.x - d.size / 2"
              [attr.y]="d.y - d.size / 2"
              [attr.width]="d.size"
              [attr.height]="d.size"
            />
            <g [attr.transform]="'translate(' + d.x + ',' + (d.y + d.size / 2 + 20) + ')'">
              <rect x="-74" y="-13" width="148" height="24" rx="12" fill="white" stroke="#a02020" stroke-width="1.5" opacity="0.98" />
              <text x="0" y="4" text-anchor="middle" font-family="var(--ngpf-font-heading)" font-size="12" font-weight="700" fill="#a02020">
                {{ d.label }} −${{ d.value | number: '1.0-0' }}
              </text>
            </g>
          </g>
        }
      </g>

      <!-- Character silhouette. Y translates with phase; group holds the
           x centre (from the outer stage transform). -->
      <g
        class="water-scene__character"
        [style.transform]="'translateY(' + characterYOffset(c) + 'px)'"
      >
        <!-- Aura ring, tinted by whether the character is submerged -->
        <circle
          cx="0"
          cy="0"
          r="52"
          fill="none"
          [attr.stroke]="isSubmerged(c) ? 'rgba(198,40,40,0.35)' : 'rgba(46,125,50,0.4)'"
          stroke-width="6"
        />
        <!-- Body -->
        <path
          d="M 0 -34 Q -6 -34 -6 -28 L -6 -18 Q -30 -8 -30 22 L 30 22 Q 30 -8 6 -18 L 6 -28 Q 6 -34 0 -34 Z"
          fill="white"
        />
        <!-- Head -->
        <circle cx="0" cy="-38" r="20" fill="white" stroke="#1a1a1a" stroke-width="2.5" />
        <!-- Face — smile above, worried when submerged -->
        @if (isSubmerged(c) && phaseIsFinal()) {
          <path d="M -8 -32 Q 0 -38 8 -32" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" />
        } @else {
          <path d="M -8 -36 Q 0 -30 8 -36" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" />
        }
        <circle cx="-6" cy="-42" r="2" fill="#1a1a1a" />
        <circle cx="6" cy="-42" r="2" fill="#1a1a1a" />
        <!-- Body outline -->
        <path
          d="M 0 -34 Q -6 -34 -6 -28 L -6 -18 Q -30 -8 -30 22 L 30 22 Q 30 -8 6 -18 L 6 -28 Q 6 -34 0 -34 Z"
          fill="none"
          [attr.stroke]="c.color"
          stroke-width="3"
          stroke-linejoin="round"
        />
        <!-- Name plate -->
        <g transform="translate(0, 42)">
          <rect x="-64" y="0" width="128" height="30" rx="15" [attr.fill]="c.color" />
          <text x="0" y="20" text-anchor="middle" font-family="var(--ngpf-font-heading)" font-size="14" font-weight="800" fill="white">
            {{ c.profile.name }}, {{ c.profile.age }}
          </text>
        </g>
        <!-- Net worth callout appears only in the final phase -->
        <g class="water-scene__nw-callout" transform="translate(0, 88)">
          <rect x="-84" y="0" width="168" height="34" rx="17" fill="white" [attr.stroke]="isSubmerged(c) ? '#a02020' : '#2e7d32'" stroke-width="2.5" />
          <text
            x="0"
            y="24"
            text-anchor="middle"
            font-family="var(--ngpf-font-heading)"
            font-size="18"
            font-weight="800"
            [attr.fill]="isSubmerged(c) ? '#a02020' : '#2e7d32'"
          >{{ fmt(c.netWorth) }}</text>
        </g>
      </g>
    </g>
  }

  <!-- Bottom caption that appears in the final phase — pill background so
       it's legible even against the deep-ocean gradient. -->
  <g class="water-scene__caption" [attr.transform]="'translate(' + (W / 2) + ',' + (H - 40) + ')'">
    <rect x="-395" y="-18" width="790" height="34" rx="17" fill="white" stroke="#0a2f4d" stroke-width="2" opacity="0.98" />
    <text x="0" y="5" text-anchor="middle" font-family="var(--ngpf-font-heading)" font-size="14" font-weight="700" fill="#0a2f4d">
      Salary is what you earn this year. Net worth is what's left after you pay off everything.
    </text>
  </g>
</svg>
