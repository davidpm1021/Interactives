<section class="predict-view" aria-labelledby="predict-heading">
  <div class="predict-view__intro">
    <h2 id="predict-heading">Who has more overall wealth?</h2>
    <p>Here's what you can see about two people. Based on just this, take a guess before we show you the full picture.</p>
  </div>

  <div class="predict-view__grid">
    <app-profile-card [profile]="profileA()" [revealedStages]="emptySet" [teaserMode]="true" />
    <app-profile-card [profile]="profileB()" [revealedStages]="emptySet" [teaserMode]="true" />
  </div>

  <div class="predict-view__prompt" role="radiogroup" aria-label="Prediction">
    <button
      type="button"
      class="predict-view__choice"
      [class.predict-view__choice--selected]="selected() === 'a'"
      [attr.aria-pressed]="selected() === 'a'"
      (click)="select('a')"
    >
      {{ profileA().name }}
    </button>
    <button
      type="button"
      class="predict-view__choice"
      [class.predict-view__choice--selected]="selected() === 'b'"
      [attr.aria-pressed]="selected() === 'b'"
      (click)="select('b')"
    >
      {{ profileB().name }}
    </button>
    <button
      type="button"
      class="predict-view__choice"
      [class.predict-view__choice--selected]="selected() === 'same'"
      [attr.aria-pressed]="selected() === 'same'"
      (click)="select('same')"
    >
      About the same
    </button>
  </div>

  <div class="predict-view__submit">
    <button
      type="button"
      class="ngpf-btn ngpf-btn-primary predict-view__submit-btn"
      [disabled]="!selected()"
      (click)="confirm()"
    >
      Reveal the full picture
    </button>
  </div>
</section>
