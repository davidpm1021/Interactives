<app-top-header class="no-print"></app-top-header>
<main class="retirement-calculator" id="main-content">
  <div class="retirement-calculator__toolbar no-print">
    <button
      type="button"
      class="retirement-calculator__icon-btn"
      (click)="onPrint()"
      title="Print / Save as PDF"
      aria-label="Print / Save as PDF"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M7 9V4h10v5M7 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v6H7z"
        />
      </svg>
    </button>
  </div>

  <div class="retirement-calculator__intro">
    <h1>Retirement Calculator</h1>
    <p>How much do you need to retire?</p>
  </div>

  <div class="retirement-calculator__grid">
    <div class="retirement-calculator__inputs">
      <app-inputs-panel [inputs]="inputs()" (inputsChange)="onInputsChange($event)" />
    </div>

    <div class="retirement-calculator__results">
      <app-results-panel
        [projection]="projection()"
        [monthlyContribution]="inputs().monthlyContribution"
      />
      <app-growth-chart [projection]="projection()" />
      <app-assumptions-panel
        [assumptions]="assumptions()"
        (assumptionsChange)="onAssumptionsChange($event)"
      />
    </div>
  </div>
</main>

<!-- Fixed-position, so it sits outside the page flow. -->
<app-scroll-cue />
