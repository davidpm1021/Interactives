<section class="results-panel" aria-label="Retirement projection">
  <div class="results-panel__tiles">
    <div class="results-panel__tile results-panel__tile--primary"
         [class.results-panel__tile--warn]="hasGap()"
         [class.results-panel__tile--ok]="!hasGap()">
      <span class="results-panel__label">You'll have</span>
      <app-stat-counter [value]="projection().finalBalance" prefix="$" />
      @if (projection().totalEmployerMatch > 0) {
        <span class="results-panel__sub results-panel__sub--match">
          Of that, {{ formatCurrency(projection().totalEmployerMatch) }} came from your employer.
        </span>
      }
    </div>

    <div class="results-panel__tile">
      <span class="results-panel__label">You'll need</span>
      <app-stat-counter [value]="projection().targetNestEgg" prefix="$" />
    </div>

  </div>

  <!--
    Opt-in, and below the two headline values rather than beside them. Review:
    the third tile "distracts from the 2 key values", and because the
    calculator recalculates on every keystroke with no submit, it "will default
    to automatically giving them the 'answer' of how to make the numbers work,
    which takes away some of the fun/exploration."

    Kept rather than deleted because the accompanying worksheet asks students
    to read this figure in three separate questions. Its wording already
    assumes a click ("Click on 'Summary View'"), so revealing on request
    matches the worksheet more closely than showing it unprompted did.
  -->
  @if (!revealed()) {
    <button
      type="button"
      class="ngpf-btn ngpf-btn-secondary results-panel__reveal"
      (click)="reveal()"
    >
      How much would I need to save?
    </button>
  } @else {
    <div class="results-panel__banner"
         [class.results-panel__banner--warn]="saveMore()"
         [class.results-panel__banner--ok]="!saveMore()"
         role="status"
         aria-live="polite">
      <span class="results-panel__banner-label">To hit target, save</span>
      <app-stat-counter [value]="projection().requiredMonthlyToHitGoal" prefix="$" suffix="/mo" />
    </div>
  }
</section>
