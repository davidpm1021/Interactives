<section class="results-panel" aria-labelledby="results-title">
  <h2 id="results-title" class="results-panel__title">Where you'll land at {{ projection().yearlyBalances[projection().yearlyBalances.length - 1].age }}</h2>

  <div class="results-panel__tiles">
    <div class="results-panel__tile results-panel__tile--primary"
         [class.results-panel__tile--warn]="hasGap()"
         [class.results-panel__tile--ok]="!hasGap()">
      <span class="results-panel__label">You'll have</span>
      <app-stat-counter [value]="projection().finalBalance" prefix="$" />
    </div>

    <div class="results-panel__tile">
      <span class="results-panel__label">You'll need</span>
      <app-stat-counter [value]="projection().targetNestEgg" prefix="$" />
    </div>

    <div class="results-panel__tile"
         [class.results-panel__tile--warn]="saveMore()"
         [class.results-panel__tile--ok]="!saveMore()">
      <span class="results-panel__label">To hit target, save</span>
      <app-stat-counter [value]="projection().requiredMonthlyToHitGoal" prefix="$" suffix="/mo" />
    </div>
  </div>
</section>
