<div class="input-panel" [class.collapsed]="isCollapsed()">
  <div class="panel-header">
    <h3>Adjust Your Inputs</h3>
    <button
      class="collapse-toggle"
      (click)="toggleCollapse()"
      [attr.aria-expanded]="!isCollapsed()"
      aria-controls="input-panel-body"
    >
      {{ isCollapsed() ? 'Show Inputs' : 'Hide Inputs' }}
    </button>
  </div>

  <div class="panel-body" id="input-panel-body" [class.hidden]="isCollapsed()">
    <!-- Starting Amount -->
    <div class="input-group">
      <label for="principal-slider">Starting Amount</label>
      <div class="input-row">
        <input
          id="principal-slider"
          type="range"
          min="0"
          max="50000"
          step="100"
          [value]="principal()"
          (input)="onPrincipalInput($event)"
          role="slider"
          [attr.aria-valuemin]="0"
          [attr.aria-valuemax]="50000"
          [attr.aria-valuenow]="principal()"
          aria-label="Starting amount slider"
        />
        <div class="number-input-wrapper">
          <span class="currency-prefix">$</span>
          <input
            type="number"
            min="0"
            max="50000"
            step="100"
            [value]="principal()"
            (input)="onPrincipalInput($event)"
            (blur)="onPrincipalBlur()"
            aria-label="Starting amount"
          />
        </div>
      </div>
    </div>

    <!-- Monthly Contribution -->
    <div class="input-group">
      <label for="contribution-slider">Monthly Contribution</label>
      <div class="input-row">
        <input
          id="contribution-slider"
          type="range"
          min="0"
          max="2000"
          step="10"
          [value]="contributionAmount()"
          (input)="onContributionInput($event)"
          role="slider"
          [attr.aria-valuemin]="0"
          [attr.aria-valuemax]="2000"
          [attr.aria-valuenow]="contributionAmount()"
          aria-label="Monthly contribution slider"
        />
        <div class="number-input-wrapper">
          <span class="currency-prefix">$</span>
          <input
            type="number"
            min="0"
            max="2000"
            step="10"
            [value]="contributionAmount()"
            (input)="onContributionInput($event)"
            (blur)="onContributionBlur()"
            aria-label="Monthly contribution"
          />
        </div>
      </div>
    </div>

    <!-- Interest Rate -->
    <div class="input-group">
      <label for="rate-slider">Interest Rate</label>
      <div class="input-row">
        <input
          id="rate-slider"
          type="range"
          min="0"
          max="15"
          step="0.1"
          [value]="interestRatePercent()"
          (input)="onRateInput($event)"
          role="slider"
          [attr.aria-valuemin]="0"
          [attr.aria-valuemax]="15"
          [attr.aria-valuenow]="interestRatePercent()"
          aria-label="Interest rate slider"
        />
        <div class="number-input-wrapper">
          <input
            type="number"
            min="0"
            max="15"
            step="0.1"
            [value]="interestRatePercent()"
            (input)="onRateInput($event)"
            (blur)="onRateBlur()"
            aria-label="Interest rate"
          />
          <span class="suffix">%</span>
        </div>
      </div>
    </div>

    <!-- Time Horizon -->
    <div class="input-group">
      <label for="time-slider">Time Horizon</label>
      <div class="input-row">
        <input
          id="time-slider"
          type="range"
          min="1"
          max="50"
          step="1"
          [value]="timeHorizon()"
          (input)="onTimeInput($event)"
          role="slider"
          [attr.aria-valuemin]="1"
          [attr.aria-valuemax]="50"
          [attr.aria-valuenow]="timeHorizon()"
          aria-label="Time horizon slider"
        />
        <div class="number-input-wrapper">
          <input
            type="number"
            min="1"
            max="50"
            step="1"
            [value]="timeHorizon()"
            (input)="onTimeInput($event)"
            (blur)="onTimeBlur()"
            aria-label="Time horizon in years"
          />
          <span class="suffix">yrs</span>
        </div>
      </div>
    </div>

    <!-- Compounding Frequency -->
    <div class="input-group">
      <label>Compounding Frequency</label>
      <div class="toggle-group" role="radiogroup" aria-label="Compounding frequency">
        <button
          role="radio"
          [attr.aria-checked]="compoundingFrequency() === 'annually'"
          [class.active]="compoundingFrequency() === 'annually'"
          (click)="onCompoundingChange('annually')"
        >
          Annually
        </button>
        <button
          role="radio"
          [attr.aria-checked]="compoundingFrequency() === 'monthly'"
          [class.active]="compoundingFrequency() === 'monthly'"
          (click)="onCompoundingChange('monthly')"
        >
          Monthly
        </button>
        <button
          role="radio"
          [attr.aria-checked]="compoundingFrequency() === 'daily'"
          [class.active]="compoundingFrequency() === 'daily'"
          (click)="onCompoundingChange('daily')"
        >
          Daily
        </button>
      </div>
    </div>
  </div>
</div>
