<div class="final-summary">
  <h2>Your Results</h2>

  <!-- Printed line, deliberately not an input: no student names are typed
       into or stored by the app. Students write it in after printing. -->
  <div class="name-line print-only">
    <span class="name-line__label">Name:</span>
    <span class="name-line__rule"></span>
  </div>

  <section class="challenge-recap" aria-labelledby="recap-heading">
    <h3 id="recap-heading">What you thought along the way</h3>
    @for (item of challengeReflections(); track item.challenge) {
      <div class="recap-item">
        <p class="recap-prompt">
          <span class="challenge-num">{{ item.challenge }}</span>
          {{ item.prompt }}
        </p>
        @if (item.answer) {
          <p class="recap-answer">{{ item.answer }}</p>
        } @else {
          <p class="recap-answer recap-answer--blank" aria-label="Not answered"></p>
        }
      </div>
    }
  </section>

  <app-takeaways-fill />

  <app-reflection-form />

  <div class="print-action">
    @if (canGoBack()) {
      <button type="button" class="ngpf-btn ngpf-btn-secondary no-print" (click)="onBack()">
        &larr; Back to Time Machine
      </button>
    }
    <button class="ngpf-btn ngpf-btn-primary" (click)="onPrint()">
      Print My Results
    </button>
  </div>
</div>
