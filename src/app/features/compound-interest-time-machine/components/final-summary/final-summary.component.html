<div class="final-summary">
  <h2>Your Results</h2>

  <div class="recap-table-wrapper">
    <table class="recap-table" aria-label="Prediction recap">
      <thead>
        <tr>
          <th scope="col">Challenge</th>
          <th scope="col">Your Guess</th>
          <th scope="col">Reality</th>
        </tr>
      </thead>
      <tbody>
        @for (row of recapRows(); track row.challenge) {
          <tr>
            <td class="challenge-cell">
              <span class="challenge-num">{{ row.challenge }}</span>
              {{ row.title }}
            </td>
            <td class="guess-cell">{{ row.guess }}</td>
            <td class="reality-cell">{{ row.reality }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <app-takeaways-fill />

  <app-reflection-form />

  <div class="print-action">
    @if (canGoBack()) {
      <button type="button" class="ngpf-btn ngpf-btn-secondary no-print" (click)="onBack()">
        &larr; Back to Time Machine
      </button>
    }
    <button class="ngpf-btn ngpf-btn-primary" (click)="onPrint()">
      Print My Results
    </button>
  </div>
</div>
