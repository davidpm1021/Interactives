<div class="sandbox">
  <div class="sandbox-inputs">
    <div class="input-group">
      <label for="sb-principal">{{ content.inputPrompts?.['principal'] }}</label>
      <div class="input-row">
        <input
          id="sb-principal"
          type="range"
          min="0"
          max="100000"
          step="100"
          [value]="principal()"
          (input)="onPrincipalInput($event)"
          aria-label="Starting amount"
        />
        <div class="number-input-wrapper">
          <span class="prefix">$</span>
          <input
            type="number"
            min="0"
            max="100000"
            step="100"
            [value]="principal()"
            (input)="onPrincipalInput($event)"
            aria-label="Starting amount"
          />
        </div>
      </div>
    </div>

    <div class="input-group">
      <label for="sb-contribution">{{ content.inputPrompts?.['contribution'] }}</label>
      <div class="input-row">
        <input
          id="sb-contribution"
          type="range"
          min="0"
          max="2000"
          step="10"
          [value]="contributionAmount()"
          (input)="onContributionInput($event)"
          aria-label="Monthly contribution"
        />
        <div class="number-input-wrapper">
          <span class="prefix">$</span>
          <input
            type="number"
            min="0"
            max="2000"
            step="10"
            [value]="contributionAmount()"
            (input)="onContributionInput($event)"
            aria-label="Monthly contribution"
          />
        </div>
      </div>
    </div>

    <div class="input-group">
      <label for="sb-rate">{{ content.inputPrompts?.['rate'] }}</label>
      <p class="input-hint">{{ content.inputPrompts?.['rateHelper'] }}</p>
      <div class="input-row">
        <input
          id="sb-rate"
          type="range"
          min="0"
          max="15"
          step="0.5"
          [value]="interestRatePercent()"
          (input)="onRateInput($event)"
          aria-label="Growth rate"
        />
        <div class="number-input-wrapper">
          <input
            type="number"
            min="0"
            max="15"
            step="0.5"
            [value]="interestRatePercent()"
            (input)="onRateInput($event)"
            aria-label="Growth rate"
          />
          <span class="suffix">%</span>
        </div>
      </div>
    </div>

    <div class="input-group age-group">
      <div class="age-field">
        <label for="sb-start-age">{{ content.inputPrompts?.['startAge'] }}</label>
        <div class="number-input-wrapper">
          <input
            id="sb-start-age"
            type="number"
            min="18"
            [max]="endAge() - 1"
            step="1"
            [value]="startAge()"
            (change)="onStartAgeInput($event)"
            aria-label="Start age"
          />
        </div>
      </div>
      <div class="age-field">
        <label for="sb-end-age">{{ content.inputPrompts?.['endAge'] }}</label>
        <div class="number-input-wrapper">
          <input
            id="sb-end-age"
            type="number"
            [min]="startAge() + 1"
            max="80"
            step="1"
            [value]="endAge()"
            (change)="onEndAgeInput($event)"
            aria-label="End age"
          />
        </div>
      </div>
    </div>

  </div>

  <div class="sandbox-chart">
    <app-growth-chart
      [result]="result()"
      [comparisonResult]="waitResult()"
      [selectedYear]="selectedYear()"
      [hoverYear]="hoverYear()"
      [isAutoPlaying]="isAutoPlaying()"
      [yAxisMax]="frozenYMax()"
      [startAge]="startAge()"
      [comparisonStartYear]="waitYears"
      (yearHover)="onYearHover($event)"
    />
    <app-time-scrubber
      [maxYear]="timeHorizon()"
      [currentYear]="selectedYear() ?? timeHorizon()"
      [startAge]="startAge()"
      [needsRerun]="needsRerun()"
      (yearChange)="onYearChange($event)"
      (playStateChange)="onPlayStateChange($event)"
    />
    <app-summary-panel
      [result]="result()"
      [selectedYear]="hoverYear() ?? selectedYear()"
      [calloutYear]="selectedYear()"
      [comparisonResult]="waitResult()"
      [animate]="isAutoPlaying()"
      [startAge]="startAge()"
      [comparisonLabel]="'Waiting ' + waitYears + ' years cost you'"
      comparisonSuffix="."
    />

    <!--
      Both toggles sit below the results rather than among the inputs. Review
      found the wait-comparison button competed with the play control ("it was
      hard to find the play/submit button at first"), so it only appears once
      the student has actually watched a run.
    -->
    <div class="result-toggles">
      @if (hasRevealed()) {
        <button
          type="button"
          class="ngpf-btn ngpf-btn-secondary toggle-btn"
          [class.active]="showWaitComparison()"
          (click)="toggleWaitComparison()"
          [attr.aria-pressed]="showWaitComparison()"
        >
          {{ content.waitToggle }}
        </button>
      }
      <button
        type="button"
        class="ngpf-btn ngpf-btn-secondary toggle-btn"
        (click)="toggleTable()"
        [attr.aria-expanded]="showTable()"
      >
        {{ showTable() ? 'Hide table' : 'Show table' }}
      </button>
    </div>

    @if (showTable()) {
      <app-growth-table
        [result]="result()"
        [startAge]="startAge()"
        [maxYear]="selectedYear()"
      />
    }
  </div>

  <div class="sandbox-finish">
    @if (canGoBack()) {
      <button type="button" class="ngpf-btn ngpf-btn-secondary" (click)="onBack()">
        &larr; Back
      </button>
    }
    <button class="ngpf-btn ngpf-btn-primary" (click)="onFinish()">
      Finish Exploring &rarr;
    </button>
  </div>
</div>
