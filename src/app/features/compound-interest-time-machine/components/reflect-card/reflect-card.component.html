<!--
  tabindex -1 so the parent can move focus here when the card appears. The
  card renders ~800px below the fold on a laptop, and focusing it scrolls it
  into view natively, which fixes sighted and screen-reader users with one
  mechanism. Focus used to go to the h2 above the chart, which on this phase
  is the same challenge title it has been all along.
-->
<div class="reflect-card" role="region" aria-label="Reflection" tabindex="-1">
  <p class="insight-text">{{ insightText() }}</p>

  @if (reflectPrompt(); as prompt) {
    <div class="reflect-prompt">
      <label class="reflect-prompt__label" [attr.for]="'reflect-' + challengeId()">
        {{ prompt }}
      </label>
      <textarea
        [id]="'reflect-' + challengeId()"
        class="reflect-prompt__input"
        rows="2"
        [value]="reflectionValue()"
        (input)="onReflectionInput($event)"
      ></textarea>
    </div>
  }

  <div class="reflect-actions">
    @if (canGoBack()) {
      <button type="button" class="ngpf-btn ngpf-btn-secondary" (click)="onBack()">
        &larr; Back
      </button>
    }
    <button
      class="ngpf-btn ngpf-btn-primary"
      (click)="onNext()"
      [attr.aria-label]="isLastChallenge() ? 'Start exploring' : 'Go to next challenge'"
    >
      {{ isLastChallenge() ? 'Start Exploring \u2192' : 'Next Challenge \u2192' }}
    </button>
  </div>
</div>
